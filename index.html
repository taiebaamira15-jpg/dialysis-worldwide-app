<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="supabase.js"></script>
<script src="config.js"></script>

<script src="jspdf.umd.min.js"></script>
<script>
/* Dialysis Worldwide – standalone data layer.
   Replaces the Claude artifact runtime with your own Supabase database.
   One table "records" (collection, id, data jsonb) protected by your login. */
(function(){
  const CFG_KEY="dw-supabase";
  const cfg=(()=>{ try{ return JSON.parse(localStorage.getItem(CFG_KEY)||"null"); }catch{ return null; } })()||window.DW_DEFAULT_CFG||null;
  // remember what kind of link opened the app (invitation / password reset) before Supabase reads it
  const AUTH_TYPE=(String(location.hash).match(/[#&]type=([a-z_]+)/)||[])[1]||"";
  const AUTH_ERR=decodeURIComponent((String(location.hash).match(/error_description=([^&]+)/)||[])[1]||"").replace(/\+/g," ");
  const rows=new Map();               // "collection/id" -> data
  const colL=new Map(), docL=new Map(); // listeners
  let sb=null, ready=null, resolveReady;
  ready=new Promise(r=>resolveReady=r);

  const rid=()=>Array.from(crypto.getRandomValues(new Uint8Array(15)),b=>"abcdefghijklmnopqrstuvwxyz0123456789"[b%36]).join("");
  const clone=o=>JSON.parse(JSON.stringify(o??{}));
  function snapDoc(path){ const d=rows.get(path); return {id:path.split("/").pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}; }
  function snapCol(col){ const docs=[...rows.keys()].filter(k=>k.startsWith(col+"/")).map(snapDoc); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}; }
  function notify(path){ const col=path.split("/")[0]; (colL.get(col)||[]).forEach(f=>{try{f(snapCol(col))}catch(e){console.error(e)}}); (docL.get(path)||[]).forEach(f=>{try{f(snapDoc(path))}catch(e){console.error(e)}}); }
  function applyPatch(base,patch){ const o=clone(base); for(const [k,v] of Object.entries(patch)){ const parts=k.split("."); let t=o; for(let i=0;i<parts.length-1;i++){ t[parts[i]]=t[parts[i]]&&typeof t[parts[i]]==="object"?t[parts[i]]:{}; t=t[parts[i]]; } if(v&&v.__delete__) delete t[parts.at(-1)]; else t[parts.at(-1)]=v; } return o; }
  async function write(path,data){ const [collection,id]=path.split("/"); rows.set(path,data); notify(path);
    const {error}=await sb.from("records").upsert({collection,id,data,updated_at:new Date().toISOString()}); if(error){ console.error(error); window.dwToast&&dwToast("Not saved: "+error.message); throw {code:"unavailable",message:error.message}; } }
  async function remove(path){ const [collection,id]=path.split("/"); rows.delete(path); notify(path);
    const {error}=await sb.from("records").delete().match({collection,id}); if(error){ console.error(error); throw {code:"unavailable",message:error.message}; } }
  function docRef(path){ return { id:path.split("/").pop(), path,
    get:async()=>{ await ready; return snapDoc(path); },
    set:async d=>{ await ready; await write(path,clone(d)); },
    update:async p=>{ await ready; const [c,i]=path.split("/"); let base=rows.get(path)||{};
      try{ const {data}=await sb.from("records").select("data").eq("collection",c).eq("id",i).maybeSingle(); if(data&&data.data) base=data.data; }catch{}
      await write(path,applyPatch(base,p)); },
    delete:async()=>{ await ready; await remove(path); },
    onSnapshot:(next)=>{ (docL.get(path)||docL.set(path,[]).get(path)).push(next); ready.then(()=>next(snapDoc(path))); return ()=>docL.set(path,(docL.get(path)||[]).filter(f=>f!==next)); } }; }
  function colRef(col){ return { path:col,
    doc:id=>docRef(col+"/"+(id||rid())),
    add:async d=>{ await ready; const id=rid(); await write(col+"/"+id,clone(d)); return docRef(col+"/"+id); },
    get:async()=>{ await ready; return snapCol(col); },
    onSnapshot:(next)=>{ (colL.get(col)||colL.set(col,[]).get(col)).push(next); ready.then(()=>next(snapCol(col))); return ()=>colL.set(col,(colL.get(col)||[]).filter(f=>f!==next)); } }; }
  const db={ collection:colRef, doc:p=>docRef(p) };

  const downloads={ save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); return {status:"saved"}; } };
  const assets={ upload:f=>new Promise((res,rej)=>{ if(f.size>1.5e6) return rej({code:"too_large",message:"Use an image under 1.5 MB"}); const r=new FileReader(); r.onload=()=>res({id:"local",url:r.result,sizeBytes:f.size,contentType:f.type}); r.onerror=rej; r.readAsDataURL(f); }), list:async()=>({assets:[]}) };

  window.claude={ use:async name=>{ if(name==="db"){ await ready; return db; } if(name==="downloads") return downloads; if(name==="assets") return assets; return null; } };

  /* ---------- setup + login screens ---------- */
  const css=`#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
  #gate .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px}
  #gate h1{font-family:var(--f-display);font-size:24px;margin:0} #gate h1 span{color:var(--brand)}
  #gate p{margin:0;color:var(--muted);font-size:14px} #gate .err{color:var(--red);font-size:14px;min-height:1em}
  #gate input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px}
  #gate label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  #acct{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgb(5 15 18/.45);padding:16px}
  #acct .card{background:var(--surface);border-radius:14px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px}`;
  document.head.insertAdjacentHTML("beforeend",`<style>${css}</style>`);
  const logo=`<svg width="34" height="38" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 2C15 2 4 15 4 22a11 11 0 0 0 22 0C26 15 15 2 15 2z" fill="#D0101C"/><path d="M10 22a5 5 0 0 0 5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
  function gate(html){ let g=document.getElementById("gate"); if(!g){ g=document.createElement("div"); g.id="gate"; document.body.appendChild(g);} g.innerHTML=`<div class="card">${logo}<h1><span>Dialysis</span> Worldwide</h1>${html}</div>`; return g; }
  function setupScreen(){
    const g=gate(`<p>First start on this device: connect the app to your Supabase database. You find both values in Supabase → Project Settings → API.</p>
      <label>Project URL<input id="g_url" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
      <label>Anon public key<input id="g_key" placeholder="eyJhbGci…" autocomplete="off"></label>
      <div class="err" id="g_err"></div><button class="btn primary" id="g_go">Connect</button>`);
    g.querySelector("#g_go").onclick=()=>{ const url=g.querySelector("#g_url").value.trim().replace(/\/$/,""), key=g.querySelector("#g_key").value.trim();
      if(!/^https:\/\/.+\.supabase\.co$/.test(url)||key.length<30){ g.querySelector("#g_err").textContent="Check the URL (ends with .supabase.co) and paste the full anon key."; return; }
      try{ localStorage.setItem(CFG_KEY,JSON.stringify({url,key})); }catch{} location.reload(); };
  }
  function loginScreen(msg){
    const g=gate(`<p>${msg||"Sign in with your email and password."}</p>
      <form id="g_form" style="display:flex;flex-direction:column;gap:12px"><label>Email<input id="g_email" type="email" autocomplete="username" required></label>
      <label>Password<input id="g_pw" type="password" autocomplete="current-password" required></label>
      <div class="err" id="g_err"></div><button class="btn primary" type="submit">Sign in</button></form>
      <button class="btn small" id="g_forgot" style="align-self:flex-start">Forgot password?</button>`);
    g.querySelector("#g_form").onsubmit=async e=>{ e.preventDefault(); g.querySelector("#g_err").textContent="Signing in…";
      const {error}=await sb.auth.signInWithPassword({email:g.querySelector("#g_email").value.trim(),password:g.querySelector("#g_pw").value});
      if(error) g.querySelector("#g_err").textContent=error.message==="Invalid login credentials"?"Wrong email or password.":error.message; else start(); };
    g.querySelector("#g_forgot").onclick=async()=>{ const em=g.querySelector("#g_email").value.trim(), err=g.querySelector("#g_err");
      if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)){ err.textContent="Type your email above first, then tap “Forgot password?” again."; return; }
      err.textContent="Sending…"; try{ await sb.functions.invoke("team",{body:{action:"reset",email:em,lang:(navigator.language||"fr").startsWith("en")?"en":"fr"}}); }catch{}
      err.textContent="If this email belongs to the team, we've sent a link to choose a new password. Check your inbox (and spam)."; };
  }
  function passwordScreen(kind){
    const welcome=kind==="invite";
    const g=gate(`<p>${welcome?"Welcome to the team! Choose a password to finish.":"Choose your new password."}</p>
      <form id="g_pf" style="display:flex;flex-direction:column;gap:12px"><label>New password<input id="g_p1" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repeat it<input id="g_p2" type="password" autocomplete="new-password" minlength="8" required></label>
      <div class="err" id="g_err"></div><button class="btn primary" type="submit">${welcome?"Join the team":"Save password"}</button></form>`);
    g.querySelector("#g_pf").onsubmit=async e=>{ e.preventDefault(); const p1=g.querySelector("#g_p1").value, p2=g.querySelector("#g_p2").value, err=g.querySelector("#g_err");
      if(p1.length<8){ err.textContent="Use at least 8 characters."; return; } if(p1!==p2){ err.textContent="The two passwords are different."; return; }
      err.textContent="Saving…"; const {error}=await sb.auth.updateUser({password:p1}); if(error){ err.textContent=error.message; return; }
      try{ await sb.functions.invoke("team",{body:{action:"joined"}}); }catch{}
      try{ history.replaceState(null,"",location.pathname); }catch{} start(); };
  }
  async function loadAll(){ rows.clear(); let from=0; for(;;){ const {data,error}=await sb.from("records").select("collection,id,data").range(from,from+999); if(error) throw error; data.forEach(r=>rows.set(r.collection+"/"+r.id,r.data)); if(data.length<1000) break; from+=1000; } }
  async function start(){
    // partner dialysis centres get their own space (portal.js); they never load the main data
    try{ const {data:pm}=await sb.rpc("portal_me"); if(pm&&window.dwPortal){ document.getElementById("gate")?.remove(); window.dwPortal(sb,pm); return; } }catch(e){ console.warn("portal check",e); }
    try{ const {data:me}=await sb.functions.invoke("team",{body:{action:"me"}}); window.dwMe=me||null; if(me&&!me.owner&&me.role==="none"){ gate(`<p>Your access to this workspace isn't active. Ask the admin to invite you again.</p><button class="btn primary" id="g_out">Sign out</button>`).querySelector("#g_out").onclick=async()=>{ await sb.auth.signOut(); location.reload(); }; return; } if(me&&!me.owner) sb.functions.invoke("team",{body:{action:"seen"}}).catch(()=>{}); }catch{}
    try{ await loadAll(); }catch(e){ loginScreen("Couldn't read the database: "+(e.message||e)+". Did you run the setup SQL in Supabase?"); return; }
    document.getElementById("gate")?.remove();
    sb.channel("records-live").on("postgres_changes",{event:"*",schema:"public",table:"records"},p=>{
      const r=p.eventType==="DELETE"?p.old:p.new; if(!r||!r.collection) return; const path=r.collection+"/"+r.id;
      if(p.eventType==="DELETE") rows.delete(path); else rows.set(path,r.data); notify(path); }).subscribe();
    addAccountButton(); resolveReady();
    let lastSync=Date.now(); document.addEventListener("visibilitychange",async()=>{ if(document.visibilityState!=="visible"||Date.now()-lastSync<60000) return; lastSync=Date.now(); try{ const before=new Set(rows.keys()); await loadAll(); new Set([...before,...rows.keys()].map(k=>k.split("/")[0])).forEach(col=>notify(col+"/_")); notify("settings/main"); }catch(e){ console.error(e); } });
    if(![...rows.keys()].some(k=>k.startsWith("patients/"))) setTimeout(openAccount,400);
  }
  /* ---------- account: backup, import, sign out ---------- */
  async function importBackup(file){ const j=JSON.parse(await file.text()); const cols=j.collections||{}; const recs=[];
    for(const [c,docs] of Object.entries(cols)) for(const [id,data] of Object.entries(docs)) recs.push({collection:c,id,data});
    for(let i=0;i<recs.length;i+=200){ const {error}=await sb.from("records").upsert(recs.slice(i,i+200)); if(error) throw error; }
    await loadAll(); [...new Set(recs.map(r=>r.collection))].forEach(c=>notify(c+"/_")); return recs.length; }
  function exportBackup(){ const cols={}; for(const [k,v] of rows){ const [c,id]=k.split("/"); (cols[c]=cols[c]||{})[id]=v; }
    downloads.save({filename:`dialysis-worldwide-backup-${new Date().toISOString().slice(0,10)}.json`,data:JSON.stringify({app:"Dialysis Worldwide",exported:new Date().toISOString(),collections:cols})}); }
  function openAccount(){ const a=document.createElement("div"); a.id="acct";
    const me=window.dwMe||{}; a.innerHTML=`<div class="card"><h3 style="margin:0;font-family:var(--f-display)">Account & data</h3>${me.email?`<p class="sub" style="margin:0">Signed in as <b>${me.email}</b> · ${me.owner?"owner":me.role}</p>`:""}
      <p class="sub" style="margin:0">Import your data from the Claude hub (the file dialysis-worldwide-backup.json), save a backup, or sign out.</p>
      <label class="btn" style="justify-content:center">Import backup file<input type="file" id="a_imp" accept=".json,application/json" hidden></label>
      <button class="btn" id="a_exp">Download a backup</button><button class="btn" id="a_out">Sign out</button><button class="btn primary" id="a_close">Close</button><div class="sub" id="a_msg"></div></div>`;
    document.body.appendChild(a);
    a.querySelector("#a_close").onclick=()=>a.remove(); a.onclick=e=>{ if(e.target===a) a.remove(); };
    a.querySelector("#a_exp").onclick=exportBackup;
    a.querySelector("#a_out").onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
    a.querySelector("#a_imp").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const m=a.querySelector("#a_msg"); m.textContent="Importing…";
      try{ const n=await importBackup(f); m.textContent=n+" records imported."; }catch(er){ m.textContent="Import failed: "+(er.message||er); } };
  }
  function addAccountButton(){ const t=document.getElementById("themeBtn"); if(!t||document.getElementById("acctBtn")) return; const b=document.createElement("button"); b.className="btn small"; b.id="acctBtn"; b.textContent="Account"; b.onclick=openAccount; t.after(b); }

  window.addEventListener("DOMContentLoaded",async()=>{
    if(!cfg){ setupScreen(); return; }
    if(!window.supabase){ gate(`<p class="err">The app couldn't load. Check your internet connection and reload.</p>`); return; }
    sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});
    window.dwSupabase=sb;
    const {data}=await sb.auth.getSession();
    if(AUTH_ERR&&!data.session){ loginScreen("This link has expired or was already used. Ask for a new invitation, or use “Forgot password?”."); return; }
    if(data.session&&(AUTH_TYPE==="invite"||AUTH_TYPE==="recovery")){ passwordScreen(AUTH_TYPE); return; }
    if(data.session&&AUTH_TYPE==="magiclink"){ try{ await sb.functions.invoke("team",{body:{action:"joined"}}); }catch{} try{ history.replaceState(null,"",location.pathname); }catch{} }
    if(data.session) start(); else loginScreen();
  });
  if("serviceWorker" in navigator && location.protocol==="https:"){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
      const check=()=>reg.update().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") check(); });
      setInterval(check,30*60*1000);
    }).catch(()=>{});
    // a new version took over: reload once so the screen shows it
    let reloaded=false; const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!hadController||reloaded) return; if(typeof S!=="undefined"&&S.drawer){ window.dwToast&&dwToast("App updated – it refreshes next time you open it"); return; } reloaded=true; location.reload(); });
  }
})();

</script>
<style>
/* Layout: a working desk — sticky header with site switcher, tab rail, one main column, detail drawer sliding from the right */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --sunk:#E4EAEC; --ink:#10242B; --muted:#56696F; --line:#D5DEE1;
  --accent:#3B4248; --accent-ink:#FFFFFF; --accent-soft:#E7EAEC; --brand:#D0101C;
  --red:#C8102E; --red-soft:#FBE3E6; --ok:#2B7A4B; --ok-soft:#DDF1E4; --warn:#9A6312; --warn-soft:#F7EBD3;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1518; --surface:#132126; --sunk:#0F1B1F; --ink:#E2EBED; --muted:#8EA2A8; --line:#24373D;
  --accent:#D4DADD; --accent-ink:#121A1D; --accent-soft:#252F35; --brand:#F0434F;
  --red:#F0566B; --red-soft:#3A1A20; --ok:#62C48E; --ok-soft:#163223; --warn:#E3AB52; --warn-soft:#352813; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1518; --surface:#132126; --sunk:#0F1B1F; --ink:#E2EBED; --muted:#8EA2A8; --line:#24373D;
  --accent:#D4DADD; --accent-ink:#121A1D; --accent-soft:#252F35; --brand:#F0434F;
  --red:#F0566B; --red-soft:#3A1A20; --ok:#62C48E; --ok-soft:#163223; --warn:#E3AB52; --warn-soft:#352813; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
.sites{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:999px;flex-wrap:wrap}
.sites button{border:0;background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
.sites button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0/.12)}
.sites .soon{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn);margin-left:4px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:1px 7px}
.count.neutral{background:var(--sunk);color:var(--muted)}
main{padding-block:22px 80px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head h2{font-size:26px;margin-right:auto}
.sub{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left}
.kpi .n{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.alert{border-color:var(--red)} .kpi.alert .n{color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M15 2C15 2 4 15 4 22a11 11 0 0 0 22 0C26 15 15 2 15 2z" fill="var(--brand)"/><path d="M10 22a5 5 0 0 0 5 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <div><b><span style="color:var(--brand)">Dialysis</span> Worldwide</b><small id="savestate">Signing in…</small></div>
    </div>
    <div class="sites" id="sites" role="group" aria-label="Site"></div>
    <button class="btn small" id="themeBtn" title="Switch light / dark">Light</button>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap" id="view"></main>
<div id="drawerHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
const SITES = {
  TN:{key:"TN", name:"Dialyse Tunisie", domain:"dialysetunisie.com", country:"Tunisia"},
  TR:{key:"TR", name:"Dialysis Turkey", domain:"dialysisturkey.com", country:"Turkey"},
  MA:{key:"MA", name:"Dialysis Morocco", domain:"", country:"Morocco", soon:true}
};
const STAGES = [
  ["lead","Website contacts"],["new","New request"],["docs","Waiting documents"],["quote","Quote sent"],
  ["confirmed","Confirmed"],["treatment","In treatment"],["done","Completed"]
];
const DOCS = [["passport","Passport copy"],["serology","Serology (HBV, HCV, HIV)"],["labs","Recent blood tests"],["prescription","Dialysis prescription"],["report","Medical report from nephrologist"],["consent","Signed consent / booking form"]];
const S = {site:"ALL", tab:"dashboard", emails:[], patients:[], invoices:[], replies:[], commissions:[], sessions:[], campaigns:[], seo:[], team:null, settings:{}, inboxFilter:"open", stage:"all", q:"", ready:false, drawer:null};
let db=null, sample=null, downloads=null, assets=null;

const h = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const nowISO = () => new Date().toISOString();
const today = () => new Date().toISOString().slice(0,10);
function fmtDate(d){ if(!d) return "—"; const x=new Date(d); if(isNaN(x)) return d; return x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year: x.getFullYear()!==new Date().getFullYear()?"numeric":undefined}); }
function ago(d){ if(!d) return ""; const m=(Date.now()-new Date(d))/60000; if(m<60) return Math.max(1,Math.round(m))+" min"; if(m<1440) return Math.round(m/60)+" h"; return Math.round(m/1440)+" d"; }
function hoursSince(d){ return d? (Date.now()-new Date(d))/3600000 : 0 }
function money(n,c){ return (Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+(c||"EUR"); }
function siteOk(x){ return S.site==="ALL" || x.site===S.site; }
function siteSet(k){ return (S.settings.sites||{})[k] || {}; }
function siteName(k){ return siteSet(k).name || SITES[k]?.name || k; }
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,2600); }
function sessionsFor(p){ if(!p.arrival||!p.departure) return 0; const days=(new Date(p.departure)-new Date(p.arrival))/86400000; if(days<=0) return 0; return Math.max(1,Math.round(days/7*(Number(p.perWeek)||3))); }
function docsDone(p){ const d=p.docs||{}; return DOCS.filter(([k])=>d[k]).length; }
function patientName(id){ const p=S.patients.find(x=>x.id===id); return p? p.name : "—"; }
function invTotal(inv){ return (inv.items||[]).reduce((a,i)=>a+(Number(i.qty)||0)*(Number(i.unit)||0),0); }

/* ---------- chrome ---------- */
function renderChrome(){
  $("sites").innerHTML = [["ALL","All sites"],...Object.values(SITES).map(s=>[s.key, s.country])].map(([k,l])=>
    `<button aria-pressed="${S.site===k}" data-site="${k}">${h(l)}${SITES[k]?.soon?'<span class="soon">soon</span>':''}</button>`).join("");
  const open = S.emails.filter(e=>!e.answered && e.kind!=="other" && siteOk(e)).length;
  renderNav();
}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-site]"); if(s){ S.site=s.dataset.site; render(); return; }
  const t=e.target.closest("[data-tab]"); if(t){ go(t.dataset.tab); return; }
});
function go(tab){ S.tab=tab; try{history.replaceState(null,"","#"+tab)}catch{} render(); window.scrollTo(0,0); }

function render(){
  renderChrome();
  const v=$("view");
  if(!S.ready){ v.innerHTML=`<div class="empty">Loading your records…</div>`; return; }
  ({dashboard:viewDashboard,today:viewDashboard,centres:viewCentres,campaigns:viewCampaigns,seo:viewSeo,team:viewTeam,inbox:viewInbox,patients:viewPatients,invoices:viewInvoices,money:viewMoney,planner:viewPlanner,insurers:viewInsurers,replies:viewReplies,settings:viewSettings}[S.tab]||viewDashboard)(v);
}

/* ---------- Today ---------- */
function viewTodayBase(v){
  const em=S.emails.filter(siteOk), pts=S.patients.filter(siteOk), inv=S.invoices.filter(siteOk);
  const open=em.filter(e=>!e.answered && e.kind!=="other").sort((a,b)=>new Date(a.receivedAt)-new Date(b.receivedAt));
  const weekAgo=Date.now()-7*864e5;
  const newApps=em.filter(e=>e.kind==="application" && new Date(e.receivedAt)>weekAgo);
  const in14=pts.filter(p=>p.arrival && new Date(p.arrival)>=new Date(today()) && new Date(p.arrival)<=new Date(Date.now()+14*864e5)).sort((a,b)=>a.arrival.localeCompare(b.arrival));
  const unpaid=inv.filter(i=>i.status!=="paid");
  const unpaidBy={}; unpaid.forEach(i=>unpaidBy[i.currency||"EUR"]=(unpaidBy[i.currency||"EUR"]||0)+invTotal(i));
  const missing=pts.filter(p=>["docs","quote","confirmed"].includes(p.stage) && docsDone(p)<DOCS.length && p.arrival && new Date(p.arrival)<=new Date(Date.now()+30*864e5)).sort((a,b)=>(a.arrival||"").localeCompare(b.arrival||""));
  const hello = new Date().getHours()<12?"Good morning":new Date().getHours()<18?"Good afternoon":"Good evening";
  v.innerHTML=`
  <div class="head"><h2>${hello}</h2><span class="sub">${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})} · ${S.site==="ALL"?"all sites":h(siteName(S.site))}</span></div>
  ${automationBanner()}
  <div class="kpis">
    <button class="kpi ${open.length?'alert':''}" data-go="inbox"><div class="n">${open.length}</div><div class="l">Emails not answered${open.filter(e=>hoursSince(e.receivedAt)>24).length?` · ${open.filter(e=>hoursSince(e.receivedAt)>24).length} over 24 h`:''}</div></button>
    <button class="kpi" data-go="inbox"><div class="n">${newApps.length}</div><div class="l">New applications this week</div></button>

function viewInbox(v){
  const all=S.emails.filter(siteOk);
  const f=S.inboxFilter;
  let list=all.filter(e=> f==="open"? (!e.answered && e.kind!=="other") : f==="answered"? e.answered : f==="application"? e.kind==="application" : f==="question"? e.kind==="question" : true);
  if(S.q){ const q=S.q.toLowerCase(); list=list.filter(e=>(e.from+e.fromName+e.subject+e.body).toLowerCase().includes(q)); }
  list.sort((a,b)=> f==="open" ? new Date(a.receivedAt)-new Date(b.receivedAt) : new Date(b.receivedAt)-new Date(a.receivedAt));
  const c=k=>all.filter(e=>k==="open"?(!e.answered&&e.kind!=="other"):k==="answered"?e.answered:k==="all"?1:e.kind===k).length;
  v.innerHTML=`<div class="head"><h2>Inbox</h2><input class="search" id="q" placeholder="Search name, subject, text" value="${h(S.q)}"><button class="btn primary" id="paste">Add an email</button></div>
  <div class="filters">${[["open","Not answered"],["answered","Answered"],["application","Applications"],["question","Questions"],["all","All"]].map(([k,l])=>`<button data-if="${k}" aria-pressed="${f===k}">${l} · ${c(k)}</button>`).join("")}</div>
  <section class="panel"><ul class="rows">${list.map(emailRow).join("")||`<li class="empty">${f==="open"?"No email is waiting for an answer.":"Nothing here yet. Emails arrive automatically once your inbox is connected, or use “Add an email” to paste one."}</li>`}</ul></section>`;
  $("q").oninput=e=>{S.q=e.target.value; const pos=e.target.selectionStart; viewInbox(v); const q=$("q"); q.focus(); q.setSelectionRange(pos,pos);};

}

function guessLang(e){
  const l=String(e.language||"").toLowerCase().slice(0,2); if(["fr","en","ar","de"].includes(l)) return l;
  const t=String(e.body||"")+" "+(e.subject||"");
  if(/[\u0600-\u06FF]/.test(t)) return "ar";
  if(/\b(bonjour|merci|séance|dialyse|je suis|vous|madame|monsieur)\b/i.test(t)) return "fr";
  if(/\b(hallo|guten|danke|ich|bitte|sehr geehrte)\b/i.test(t)) return "de";
  return "en";
}

async function draftReply(e){
  if(!sample){
    const ta=$("eReply"); ta.value=localDraft(e); await db.doc("emails/"+e.id).update({draftReply:ta.value});
    toast("Draft ready. Fill in the [to confirm] parts."); return;
  }
  const btn=$("eDraft"), ta=$("eReply"); btn.disabled=true; btn.textContent="Writing…";
  const s=siteSet(e.site);
  const lib=S.replies.map(r=>`### ${r.title} (${r.lang})\n${fillTemplate(r.body,e.site)}`).join("\n\n").slice(0,12000);
  const p=S.patients.find(x=>x.id===e.patientId);
  const prompt=`You answer emails for ${siteName(e.site)} (${s.domain||SITES[e.site]?.domain||""}), part of Dialysis Worldwide, a service that organises holiday hemodialysis sessions in ${SITES[e.site]?.country} for international patients.
Write the reply email body only (no subject line), in the same language as the patient's email. Warm, short, clear. Use plain text.
Rules: use ONLY facts from the business info and reply library below. If information is missing (a price, a date, availability), do not invent it: write it as [to confirm] so the team fills it in. Never give medical advice, never promise results; for medical questions say the patient's own nephrologist and our medical team will confirm. Always say which documents we still need if this is a booking request. Sign as "${s.signature||"The "+siteName(e.site)+" team"}".

BUSINESS INFO
Price per session: ${s.price?money(s.price,s.currency):"not set"}
Contact: ${s.email||""} ${s.phone||""}
Address / centres: ${s.address||"not set"}
Extra notes: ${s.notes||""}
${p?`\nPATIENT FILE: ${p.name}, stage ${p.stage}, dates ${p.arrival||"?"} to ${p.departure||"?"}, documents received: ${DOCS.filter(([k])=>(p.docs||{})[k]).map(d=>d[1]).join(", ")||"none"}`:""}

REPLY LIBRARY
${lib}

PATIENT EMAIL (from ${e.fromName||e.from}):
${String(e.body).slice(0,8000)}`;
  try{
    const r=await sample(prompt,{onText:({text})=>{ta.value=text;}, cache:false});
    ta.value=r.text; await db.doc("emails/"+e.id).update({draftReply:r.text}); toast("Draft ready. Check the [to confirm] parts.");
  }catch(err){ toast(err.code==="not_granted"?"Claude access was declined for this page":"Couldn't write a draft. Try again in a moment."); }
  btn.disabled=false; btn.textContent="Write a new draft";
}

/* ---------- Invoices ---------- */
function nextNumber(site){
  const y=new Date().getFullYear(), pre=`DW-${site}-${y}-`;
  const n=S.invoices.filter(i=>(i.number||"").startsWith(pre)).map(i=>parseInt(i.number.slice(pre.length))||0);
  return pre+String((n.length?Math.max(...n):0)+1).padStart(4,"0");
}
async function newInvoice(p){
  const s=siteSet(p.site), n=sessionsFor(p)||1;
  const items=[{desc:`Hemodialysis session (${p.hours||"4 h"})${p.arrival?`, ${fmtDate(p.arrival)} – ${fmtDate(p.departure)}`:""}`,qty:n,unit:Number(s.price)||0}];
  const due=new Date(Date.now()+14*864e5).toISOString().slice(0,10);
  const ref=await db.collection("invoices").add({number:nextNumber(p.site),patientId:p.id,site:p.site,items,currency:s.currency||"EUR",issued:today(),due,status:"unpaid",note:"",createdAt:nowISO()});
  openInvoice(ref.id);
}

async function logoDataUrl(){

  try{ const r=await fetch(st.logoUrl); const b=await r.blob(); return await new Promise((res,rej)=>{const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(b);}); }catch{ return null; }
}
async function invoicePdf(inv){

/* ---------- Commissions (profit manager) ---------- */
function moneySet(){ const m=S.settings.money||{}; return {rate:Number(m.rate)||3.4, centerFee:Number(m.centerFee)||200, commission:Number(m.commission)||20}; }
function calcC(e){
  const rate=Number(e.exchangeRate)||1, sessions=Number(e.sessions)||0, fee=Number(e.centerFee)||moneySet().centerFee, pct=Number(e.commissionRate)||0;
  const totalPaidTND=(Number(e.totalPaidEuro)||0)*rate, centerTotal=fee*sessions, remaining=totalPaidTND-centerTotal, myProfit=remaining*pct/100;
  return {totalPaidTND, centerTotal, remaining, myProfit, netAfterCommission:remaining-myProfit};
}
const tnd=n=>(Number(n)||0).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})+" TND";
function sessionsInInvoice(inv){ const s=(inv.items||[]).filter(i=>/dialys|session|séance/i.test(i.desc||"")).reduce((a,i)=>a+(Number(i.qty)||0),0); return s||((inv.items||[])[0]?.qty)||0; }
async function commissionFromInvoice(inv){
  if(S.commissions.some(c=>c.invoiceId===inv.id)) return false;
  const p=S.patients.find(x=>x.id===inv.patientId)||{}, m=moneySet();
  await db.collection("commissions").add({date:inv.paidAt||nowISO(), name:p.name||"Patient", patientId:inv.patientId||"", invoiceId:inv.id, invoiceNumber:inv.number||"", site:inv.site||"TN",
    center:p.center||p.city||"", totalPaidEuro:invTotal(inv), currency:inv.currency||"EUR", sessions:sessionsInInvoice(inv), exchangeRate:(inv.currency==="TND"?1:m.rate), centerFee:m.centerFee, commissionRate:m.commission, status:"unpaid", auto:true});
  return true;
}

/* ---------- Shared helpers for planner, insurers, campaigns ---------- */
const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYFR=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const FR_COUNTRIES=/france|belg|suisse|switz|alg|maroc|moroc|tunis|luxem|canada|québec/i;
function centres(){ return Array.isArray(S.settings.centers)?S.settings.centers:[]; }
function centresFor(site){ const all=centres(); return site&&site!=="ALL"?all.filter(c=>(c.site||"TN")===site):all; }
const centreOpt=c=>`<option value="${h(c.name)}">${h(c.city||"")}</option>`;
function centreBy(name){ return centres().find(c=>c.name===name)||{name:name||""}; }
function dayPattern(p){ if(Array.isArray(p.days)&&p.days.length) return p.days.map(Number);
  return ({1:[1],2:[2,5],3:[1,3,5],4:[1,2,4,6],5:[1,2,3,4,5],6:[1,2,3,4,5,6]})[Number(p.perWeek)||3]||[1,3,5]; }
function isoDay(d){ const x=new Date(d); return new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())).toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function mondayOf(iso){ const d=new Date(iso+"T12:00:00Z"); const k=(d.getUTCDay()+6)%7; return addDays(iso,-k); }
function dow(iso){ return new Date(iso+"T12:00:00Z").getUTCDay(); }
function patientSessions(id){ return S.sessions.filter(s=>s.patientId===id && s.status!=="cancelled").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); }
function langOf(p){ if(p.lang) return p.lang; return FR_COUNTRIES.test(p.nationality||"")?"fr":/german|deutsch|allemagne|austria|autriche/i.test(p.nationality||"")?"de":"en"; }
function nameKey(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(w=>w.length>2&&!["mme","mrs","monsieur","madame","epouse","mlle"].includes(w)); }
function commsFor(p){ const pk=nameKey(p.name);
  return S.commissions.filter(c=>{ if(c.patientId) return c.patientId===p.id; const ck=nameKey(c.name); if(!ck.length) return false;
    const common=ck.filter(w=>pk.includes(w)); return common.length>=2 || (common.length===1 && ck.length===1 && common[0].length>=5) || (common.length===1 && pk.length===1 && common[0].length>=5); }); }
function waLink(p,text){ const d=String(p.phone||"").replace(/[^\d]/g,"").replace(/^00/,""); return d.length>=8?`https://wa.me/${d}?text=${encodeURIComponent(text)}`:""; }

/* ---------- Session planning ---------- */
async function planSessions(p){
  if(!p.arrival||!p.departure){ toast("Add arrival and departure dates first"); return; }
  const pat=dayPattern(p), c=centreBy(p.center), time=p.time||c.defaultTime||"07:00";
  const old=S.sessions.filter(s=>s.patientId===p.id && s.status==="planned");
  const dates=[]; for(let d=p.arrival; d<p.departure; d=addDays(d,1)) if(pat.includes(dow(d))) dates.push(d);
  if(!dates.length){ toast("No dialysis day falls inside these dates"); return; }
  for(const s of old) await db.doc("sessions/"+s.id).delete();
  for(const d of dates) await db.collection("sessions").add({patientId:p.id,name:p.name,center:p.center||"",date:d,time,status:"planned",site:p.site||"TN",mode:p.mode||"HD"});
  toast(`${dates.length} sessions planned${old.length?" (replaced "+old.length+")":""}`);
  setTimeout(()=>openPatient(p.id),600);
}

/* planner: centre filter as a dropdown (grouped by city) + quick chips for centres used this week */
function centreFilter(cf,cNames,weekList){
  const d0=S.week||mondayOf(today()), d6=addDays(d0,6);
  const busy={}; S.sessions.filter(s=>siteOk(s)&&s.status!=="cancelled"&&s.center&&s.date>=d0&&s.date<=d6).forEach(s=>{ busy[s.center]=(busy[s.center]||0)+1; });
  const quick=Object.keys(busy).sort((a,b)=>busy[b]-busy[a]).slice(0,5);
  const byCity={}; cNames.forEach(n=>{ const c=centres().find(x=>x.name===n); const k=(c&&c.city)||"Other"; (byCity[k]=byCity[k]||[]).push(n); });
  const opts=Object.keys(byCity).sort((a,b)=>a.localeCompare(b)).map(k=>`<optgroup label="${h(k)}">${byCity[k].sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${h(n)}" ${cf===n?"selected":""}>${h(n)}${busy[n]?` (${busy[n]})`:""}</option>`).join("")}</optgroup>`).join("");
  return `<div class="filters" style="align-items:center"><button data-cf="all" aria-pressed="${cf==="all"}">All centres</button>${quick.map(c=>`<button data-cf="${h(c)}" aria-pressed="${cf===c}">${h(c)} · ${busy[c]}</button>`).join("")}

  const aud=[["lead","Website contacts (past enquiries)"],["done","Completed stays"],["all","Everyone with an email"]];

   <p class="sub" style="margin:0">Claude writes one email per language. You copy the text and the address list into Brevo (or your mailbox, in BCC) and send it yourself.</p>
   <div class="form"><label class="f">Who<select id="cg_aud">${aud.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label>
    <label class="f">Site<select id="cg_site">${Object.values(SITES).filter(x=>!x.soon).map(x=>`<option value="${x.key}">${h(siteName(x.key))}</option>`).join("")}</select></label>
    <label class="f full">Occasion or offer<input id="cg_occ" value="Christmas and winter holidays 2026: book your dialysis sessions early"></label></div>
   <div class="actions"><button class="btn primary" id="cgGo">Write the emails</button></div><div id="cgOut" style="display:flex;flex-direction:column;gap:14px"></div></div>`);

    const a=$("cg_aud").value, site=$("cg_site").value;
    const ppl=S.patients.filter(p=>p.email&&/@/.test(p.email)&&!/example\.|allianz|mutas/i.test(p.email)&&(a==="all"||p.stage===a||(a==="done"&&commsFor(p).length)));
    const groups={}; ppl.forEach(p=>{const l=langOf(p)==="fr"?"fr":langOf(p)==="de"?"de":"en"; (groups[l]=groups[l]||[]).push(p);});
    const out=$("cgOut"); if(!ppl.length){ out.innerHTML=`<p class="sub">Nobody matches this group.</p>`; return; }
    if(!sample){ toast("Claude isn't available in this view"); return; }
    $("cgGo").disabled=true; $("cgGo").textContent="Writing…"; const s=siteSet(site);
    out.innerHTML=Object.entries(groups).map(([l,ps])=>`<section class="panel"><h3>${({fr:"Français",en:"English",de:"Deutsch"})[l]} <span>${ps.length} recipients</span></h3><div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px"><textarea id="cgT_${l}" rows="12" style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%">Writing…</textarea><div class="actions"><button class="btn small" data-cgcopy="${l}">Copy email text</button><button class="btn small" data-cgaddr="${l}">Copy ${ps.length} addresses</button><button class="btn small" data-cgcsv="${l}">Download CSV for Brevo</button></div></div></section>`).join("");
    S._cg=groups;
    for(const [l,ps] of Object.entries(groups)){
      const lang=({fr:"French",en:"English",de:"German"})[l];
      try{ const r=await sample(`Write a short, warm marketing email in ${lang} for ${siteName(site)} (${s.domain||SITES[site]?.domain}), part of Dialysis Worldwide, which organises holiday hemodialysis sessions in ${SITES[site]?.country} for dialysis patients and their families. Audience: people who contacted us or dialysed with us before. Occasion: ${$("cg_occ").value}.

const PUSH_FN="push";
function b64u(s){ const b=atob((s+"=".repeat((4-s.length%4)%4)).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function pushState(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  const reg=await navigator.serviceWorker.ready; return (await reg.pushManager.getSubscription())?"on":"off";
}
async function updatePushCard(){
  const m=$("pushMsg"), b=$("pushBtns"); if(!m) return;
  const st=await pushState().catch(()=>"unsupported"), ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(!$("pushMsg")) return;
  if(st==="unsupported"){ m.textContent=ios?"On iPhone: open this page in Safari, tap Share → “Add to Home Screen”, then open Dialysis WW from the home-screen icon and tap “Turn on” here.":"This browser can't show notifications."; b.innerHTML=""; return; }
  if(st==="denied"){ m.textContent="Notifications are blocked. Allow them in your phone settings → Notifications → Dialysis WW."; b.innerHTML=""; return; }
  if(st==="on"){ m.textContent="On for this device: you get a notification for every new application or question."; b.innerHTML=`<button class="btn small" id="pushTest">Send a test</button> <button class="btn small" id="pushOff">Turn off</button>`; $("pushTest").onclick=pushTest; $("pushOff").onclick=pushOff; return; }
  m.textContent="Get a notification on this device for every new application or question."; b.innerHTML=`<button class="btn small primary" id="pushOn">Turn on</button>`; $("pushOn").onclick=pushOn;
}
async function pushCall(body){ const {data,error}=await window.dwSupabase.functions.invoke(PUSH_FN,{body}); if(error) throw new Error(error.message||String(error)); if(data&&data.error) throw new Error(data.error); return data; }
async function pushOn(){
  try{
    const p=await Notification.requestPermission(); if(p!=="granted"){ updatePushCard(); return; }
    const reg=await navigator.serviceWorker.ready, {publicKey}=await pushCall({action:"publicKey"});
    let s=await reg.pushManager.getSubscription(); if(!s) s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(publicKey)});
    await pushCall({action:"subscribe",sub:s.toJSON(),device:navigator.userAgent}); toast("Notifications turned on");
  }catch(e){ toast("Couldn't turn on: "+(e.message||e)); }
  updatePushCard();
}
async function pushTest(){ try{ const r=await pushCall({action:"test"}); toast(r.sent?`Test sent to ${r.sent} device${r.sent>1?"s":""}`:"No device received it"); }catch(e){ toast("Test failed: "+(e.message||e)); } }
async function pushOff(){ try{ const reg=await navigator.serviceWorker.ready, s=await reg.pushManager.getSubscription(); if(s){ await pushCall({action:"unsubscribe",endpoint:s.endpoint}).catch(()=>{}); await s.unsubscribe(); } toast("Notifications off on this device"); }catch(e){ toast(String(e.message||e)); } updatePushCard(); }

function emailInvoice(inv){
  const p=S.patients.find(x=>x.id===inv.patientId)||{}, fr=langOf(p)==="fr", s=siteSet(inv.site), sign=s.signature||(fr?"L'équipe "+siteName(inv.site):"The "+siteName(inv.site)+" team");
  const amt=money(invTotal(inv),inv.currency);
  const text=fr?`Bonjour${p.name?" "+p.name:""},\n\nVeuillez trouver ci-joint la facture ${inv.number} d'un montant de ${amt}${inv.due?`, à régler avant le ${fmtDate(inv.due)}`:""}.\n\nN'hésitez pas à nous contacter pour toute question.\n\nBien cordialement,\n${sign}`
    :`Hello${p.name?" "+p.name:""},\n\nPlease find attached invoice ${inv.number} for ${amt}${inv.due?`, due by ${fmtDate(inv.due)}`:""}.\n\nPlease let us know if you have any questions.\n\nKind regards,\n${sign}`;
  openCompose({site:inv.site,to:p.email||"",subject:(fr?"Facture ":"Invoice ")+inv.number+" – "+siteName(inv.site),text,patientId:inv.patientId,invoiceId:inv.id});

function openCompose(o){
  const p=S.patients.find(x=>x.id===o.patientId), invs=p?S.invoices.filter(i=>i.patientId===p.id):[], tn=o.site==="TN", files=[];
  const fromAddr=siteSet("TN").email||"contact@dialysetunisie.com";
  drawer(`<header><h3>${tn?"Send email":"Write email"}</h3><button class="x" data-close aria-label="Close">×</button></header>
  <div class="body"><div class="form">
    <label class="f full">To<input id="cTo" type="email" inputmode="email" value="${h(o.to||"")}" placeholder="patient@example.com"></label>
    <label class="f full">Subject<input id="cSub" value="${h(o.subject||"")}"></label>
    <label class="f full">Message<textarea id="cText" rows="12">${h(o.text||"")}</textarea></label></div>
    ${tn?`<div class="section-l">Attachments</div><div class="att">
      ${invs.map(i=>`<label class="chk"><input type="checkbox" data-inv="${i.id}" ${o.invoiceId===i.id?"checked":""}> Invoice ${h(i.number)} · ${money(invTotal(i),i.currency)}</label>`).join("")}
      ${p?`<label class="chk"><input type="checkbox" id="cConf"> Booking confirmation PDF</label>`:""}
      <label class="btn small" style="align-self:flex-start">Add a file from this device<input type="file" id="cFile" multiple hidden></label><div class="sub" id="cFiles"></div></div>`
    :`<p class="sub" style="margin:0">Dialysis Turkey's Zoho plan can't send from the app. “Open in mail app” starts a new email in your phone's mail app with everything filled in; attach PDFs there.</p>`}
    <div class="actions">${tn?`<button class="btn primary" id="cSend">Send from ${h(fromAddr)}</button>`:`<button class="btn primary" id="cMailto">Open in mail app</button>`}</div>
    <div class="sub" id="cMsg"></div></div>`);
  const val=()=>({to:$("cTo").value.trim(),subject:$("cSub").value.trim(),text:$("cText").value});
  if(!tn){ $("cMailto").onclick=()=>{ const v=val(); location.href=`mailto:${encodeURIComponent(v.to)}?subject=${encodeURIComponent(v.subject)}&body=${encodeURIComponent(v.text.slice(0,1800))}`; }; return; }
  $("cFile").onchange=ev=>{ for(const f of ev.target.files) files.push(f); ev.target.value=""; $("cFiles").innerHTML=files.map(f=>h(f.name)+" ("+Math.round(f.size/1024)+" KB)").join("<br>"); };
  const btn=$("cSend"), msg=$("cMsg");
  ["cTo","cSub","cText"].forEach(k=>$(k).addEventListener("input",()=>{ delete btn.dataset.sure; btn.textContent="Send from "+fromAddr; }));
  btn.onclick=async()=>{
    const v=val();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v.to)){ msg.textContent="Check the email address."; return; }
    if(!v.subject||!v.text.trim()){ msg.textContent="Write a subject and a message."; return; }
    if(/\[(to confirm|à confirmer|للتأكيد|zu bestätigen)[^\]]*\]/i.test(v.text)){ msg.textContent="The message still has [to confirm] parts – fill them in first."; return; }
    if(!btn.dataset.sure){ btn.dataset.sure=1; btn.textContent="Tap again to send to "+v.to; msg.textContent=""; return; }
    btn.disabled=true; btn.textContent="Sending…";
    try{
      const atts=[]; let firstInv=null;
      for(const cb of document.querySelectorAll("[data-inv]:checked")){ const inv=S.invoices.find(x=>x.id===cb.dataset.inv); if(!inv) continue; firstInv=firstInv||inv.id;
        const c=await capturePdf(()=>invoicePdf(inv)); if(c) atts.push({filename:c.filename,contentType:"application/pdf",content:await blobB64(c.blob)}); }
      if($("cConf")&&$("cConf").checked){ const c=await capturePdf(()=>confirmPdf(p)); if(c) atts.push({filename:c.filename,contentType:"application/pdf",content:await blobB64(c.blob)}); }
      for(const f of files) atts.push({filename:f.name,contentType:f.type||"application/octet-stream",content:await blobB64(f)});
      const size=atts.reduce((n,a)=>n+a.content.length*3/4,0); if(size>9*1024*1024) throw new Error("Attachments are too large (max 9 MB together).");
      const {data,error}=await window.dwSupabase.functions.invoke("send-mail",{body:{site:"TN",...v,emailId:o.emailId||null,patientId:o.patientId||null,invoiceId:o.invoiceId||firstInv,attachments:atts}});
      if(error){ let m=error.message; try{ const j=await error.context.json(); m=j.error||m; }catch{} throw new Error(m); }
      if(data&&data.error) throw new Error(data.error);
      toast("Email sent to "+v.to+(data&&data.savedToSent?" · saved in Sent":"")); closeDrawer();
    }catch(e){ btn.disabled=false; delete btn.dataset.sure; btn.textContent="Send from "+fromAddr; msg.textContent=String(e.message||e); }
  };
}

function cgFill(t,site,p,lang){
  const s=siteSet(site), country=SITES[site]?.country||"", first=String((p&&p.name)||"").trim().split(/\s+/)[0]||"";
  const price=s.price?money(s.price,s.currency):(lang==="fr"?"[tarif à confirmer]":"[price to confirm]");
  return String(t).replaceAll("{name}",first).replaceAll("{site}",siteName(site)).replaceAll("{country}",lang==="fr"?(COUNTRY_FR[country]||country):country)
    .replaceAll("{price}",price).replaceAll("{phone}",s.phone||"").replaceAll("{signature}",s.signature||(lang==="fr"?"L'équipe "+siteName(site):"The "+siteName(site)+" team"))
    .replace(/Bonjour ,/,"Bonjour,").replace(/Hello ,/,"Hello,");
}
function cgAudience(o){
  const seen=new Set();
  return S.patients.filter(p=>{
    const em=String(p.email||"").trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)||seen.has(em)) return false;
    if(p.noMarketing||p.example||/(^|\s)test(\s|$)/i.test(p.name||"")||/allianz|mutas|assistance|example\./i.test(em)) return false;
    if((p.site||"TN")!==o.site) return false;
    if(!o.stages.includes(p.stage||"new")) return false;
    if(o.lang!=="all"&&cgLang(p)!==o.lang) return false;
    if(o.nat&&!String(p.nationality||"").toLowerCase().includes(o.nat.toLowerCase())) return false;
    seen.add(em); return true; });
}

async function cgSendOne(r,c){
  const l=r.lang==="en"?"en":"fr", subj=l==="fr"?(c.subjectFr||c.subjectEn):(c.subjectEn||c.subjectFr), body=l==="fr"?(c.bodyFr||c.bodyEn):(c.bodyEn||c.bodyFr);

  if(error){ let m=error.message; try{ const j=await error.context.json(); m=j.error||m; }catch{} throw new Error(m); }
  if(data&&data.error) throw new Error(data.error);
}
let cgRunning=null;
window.addEventListener("beforeunload",e=>{ if(cgRunning){ e.preventDefault(); e.returnValue=""; } });
async function runCampaign(id){
  if(cgRunning){ toast("Another campaign is already sending"); return; }
  cgRunning=id;
  try{
    for(;;){
      const c=S.campaigns.find(x=>x.id===id); if(!c) { await new Promise(r=>setTimeout(r,800)); if(!S.campaigns.find(x=>x.id===id)) break; continue; }
      const rec=(c.recipients||[]).map(x=>({...x})), k=rec.findIndex(x=>x.status==="waiting");
      if(k<0){ toast(`Campaign finished: ${rec.filter(x=>x.status==="sent").length} sent`); break; }
      if(sentToday()>=CG_DAILY){ toast(`Daily limit of ${CG_DAILY} reached – continue tomorrow from Campaigns`); break; }
      try{ await cgSendOne(rec[k],c); rec[k].status="sent"; rec[k].at=nowISO(); }
      catch(e){ rec[k].status="failed"; rec[k].error=String(e.message||e).slice(0,140); rec[k].at=nowISO(); }
      await db.doc("campaigns/"+id).update({recipients:rec});
      const left=rec.filter(x=>x.status==="waiting").length; const p=$("cgProg"); if(p) p.textContent=`${rec.length-left} of ${rec.length} done…`;
      toast(`Sending: ${rec.length-left} of ${rec.length}`);
      await new Promise(r=>setTimeout(r,3000));
    }
  } finally { cgRunning=null; render(); }
}
function openCampaignRun(id){
  const c=S.campaigns.find(x=>x.id===id); if(!c) return;
  const r=c.recipients||[], w=r.filter(x=>x.status==="waiting").length, f=r.filter(x=>x.status==="failed");
  drawer(`<header><h3>${h(c.name)}</h3><button class="x" data-close aria-label="Close">×</button></header><div class="body">
   <div class="meta"><span class="site-tag">${h(siteName(c.site))}</span><span>Created ${fmtDate(c.createdAt)}</span><span id="cgProg">${r.length-w} of ${r.length} done</span></div>
   <div class="actions">${w&&c.site==="TN"?`<button class="btn primary" id="cgCont">${cgRunning===id?"Sending…":"Continue sending ("+w+" waiting)"}</button>`:""}${f.length?`<button class="btn" id="cgRetry">Retry ${f.length} failed</button>`:""}<button class="btn" id="cgDup">Use as a new campaign</button></div>
   <div class="section-l">French</div><pre class="mail" style="white-space:pre-wrap">${h(c.subjectFr||"")}\n\n${h(c.bodyFr||"")}</pre>
   <div class="section-l">English</div><pre class="mail" style="white-space:pre-wrap">${h(c.subjectEn||"")}\n\n${h(c.bodyEn||"")}</pre>
   <div class="section-l">Recipients</div><section class="panel"><ul class="rows">${r.map(x=>`<li><div class="row" style="cursor:default"><span class="dot ${x.status==="sent"?"ok":x.status==="failed"?"red":"warn"}"></span><span style="min-width:0"><div class="t">${h(x.name||x.email)}</div><div class="s">${h(x.email)}${x.error?" · "+h(x.error):""}</div></span><span class="r">${h(x.status)}</span></div></li>`).join("")}</ul></section></div>`);
  if($("cgCont")) $("cgCont").onclick=()=>{ if(cgRunning) return; $("cgCont").textContent="Sending…"; runCampaign(id); };
  if($("cgRetry")) $("cgRetry").onclick=async()=>{ await db.doc("campaigns/"+id).update({recipients:r.map(x=>x.status==="failed"?{...x,status:"waiting",error:""}:x)}); closeDrawer(); runCampaign(id); };
  $("cgDup").onclick=()=>{ openCampaignEditor(); setTimeout(()=>{ $("cg_sfr").value=c.subjectFr||""; $("cg_bfr").value=c.bodyFr||""; $("cg_sen").value=c.subjectEn||""; $("cg_ben").value=c.bodyEn||""; $("cg_site").value=c.site; document.querySelector(".drawer").dispatchEvent(new Event("input")); },50); };
}

const MONTHS_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtN=n=>(Number(n)||0).toLocaleString("en-GB",{maximumFractionDigits:1});
const fmtD=d=>{ const x=new Date(d+"T12:00:00Z"); return x.getUTCDate()+" "+MONTHS_SHORT[x.getUTCMonth()]; };
/* tooltip shared by all charts */
document.addEventListener("pointerover",e=>{ const t=e.target.closest("[data-tip]"); const tip=$("vizTip")||(()=>{const d=document.createElement("div"); d.id="vizTip"; d.setAttribute("role","status"); document.body.appendChild(d); return d;})();

/* vertical bars (one series) */
function vizBars(data,{h=150,fmt=fmtN,label=""}={}){
  if(!data.length||data.every(d=>!d.value)) return `<div class="empty">Nothing yet in this period.</div>`;
  const W=640, H=h, padL=34, padB=22, padT=10, max=Math.max(1,...data.map(d=>d.value)), step=(W-padL)/data.length, bw=Math.max(6,Math.min(38,step*.62));
  const nice=niceMax(max), ticks=nice<=2?[0,nice]:[0,nice/2,nice];
  const y=v=>padT+(H-padT-padB)*(1-v/nice);
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h_(label)}">
   ${ticks.map(t=>`<line class="grid" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${padL-6}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")}
   ${data.map((d,i)=>{ const x=padL+i*step+(step-bw)/2, top=y(d.value), hh=Math.max(0,H-padB-top);
     return `<path data-m="${i}" class="bar" d="${barPath(x,top,bw,hh)}"/>
     <rect data-k="${i}" data-tip="<b>${h_(d.tip||d.label)}</b><br>${h_(fmt(d.value))}" x="${padL+i*step}" y="${padT}" width="${step}" height="${H-padT}" fill="transparent"/>
     ${(data.length<=12||i%Math.ceil(data.length/8)===0)?`<text class="ax" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${h_(d.label)}</text>`:""}`; }).join("")}
  </svg>`;
}
function barPath(x,y,w,h){ if(h<=0) return ""; const r=Math.min(4,h,w/2); return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; }
function niceMax(m){ const p=Math.pow(10,Math.floor(Math.log10(m||1))); const n=m/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
const h_=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* line over days (one series); invert=true for ranking position (1 = top) */
function vizLine(pts,{h=170,fmt=fmtN,invert=false,label="",unit=""}={}){
  pts=pts.filter(p=>p.y!=null&&!isNaN(p.y)); if(pts.length<2) return `<div class="empty">Not enough data yet.</div>`;
  const W=640, H=h, padL=38, padB=22, padT=12, ys=pts.map(p=>p.y);
  let lo=Math.min(...ys), hi=Math.max(...ys); if(invert){ lo=Math.max(1,Math.floor(lo)); hi=Math.ceil(hi); } else { lo=0; hi=niceMax(hi); } if(hi===lo) hi=lo+1;
  const x=i=>padL+(W-padL-8)*i/(pts.length-1), y=v=>{ const t=(v-lo)/(hi-lo); return padT+(H-padT-padB)*(invert?t:1-t); };
  const ticks=invert?[lo,Math.round((lo+hi)/2),hi]:[0,hi/2,hi];
  const d=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join("");
  const every=Math.ceil(pts.length/6);
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h_(label)}">
   ${ticks.map(t=>`<line class="grid" x1="${padL}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${padL-6}" y="${y(t)+4}" text-anchor="end">${invert?"#":""}${fmt(t)}</text>`).join("")}
   <path class="line" d="${d}"/>
   ${pts.map((p,i)=>`<circle data-m="${i}" class="pt" cx="${x(i)}" cy="${y(p.y)}" r="4"/>`).join("")}
   ${pts.map((p,i)=>`<rect data-k="${i}" data-tip="<b>${h_(p.label||fmtD(p.x))}</b><br>${invert?"Position ":""}${h_(fmt(p.y))}${unit}" x="${x(i)-(W-padL)/pts.length/2}" y="${padT}" width="${(W-padL)/pts.length}" height="${H-padT-padB}" fill="transparent"/>`).join("")}
   ${pts.map((p,i)=>i%every===0?`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${h_(p.label||fmtD(p.x))}</text>`:"").join("")}
  </svg>`;
}
/* horizontal bars in HTML (good for countries / nationalities) */
function vizHBars(rows,{fmt=fmtN,max=8}={}){
  rows=rows.slice(0,max); if(!rows.length) return `<div class="empty">No data yet.</div>`; const m=Math.max(1,...rows.map(r=>r.value));
  return `<div class="hbars">${rows.map(r=>`<div class="hb" data-tip="<b>${h_(r.label)}</b><br>${h_(fmt(r.value))}"><span class="hbl">${h_(r.label)}</span><span class="hbt"><i style="width:${Math.max(2,r.value/m*100)}%"></i></span><span class="hbv">${h_(fmt(r.value))}</span></div>`).join("")}</div>`;
}
function vizCard(title,sub,body){ return `<section class="panel"><h3>${title}${sub?` <span>${sub}</span>`:""}</h3><div class="vizwrap">${body}</div></section>`; }

function activityCharts(){
  const m=last12(), em=S.emails.filter(siteOk), pts=S.patients.filter(siteOk), inv=S.invoices.filter(siteOk);
  const count=(arr,f)=>m.map(x=>({...x,value:arr.filter(o=>String(f(o)||"").slice(0,7)===x.key).length}));
  const apps=count(em.filter(e=>e.kind==="application"),e=>e.receivedAt);
  const arr=count(pts.filter(p=>p.arrival&&p.stage!=="lost"),p=>p.arrival);
  const rev=m.map(x=>({...x,value:inv.filter(i=>(i.currency||"EUR")==="EUR"&&String(i.issued||"").slice(0,7)===x.key).reduce((a,i)=>a+invTotal(i),0)}));
  const nat={}; pts.forEach(p=>{ const k=(p.nationality||"").trim()||"Unknown"; nat[k]=(nat[k]||0)+1; });
  const natRows=Object.entries(nat).filter(([k])=>k!=="Unknown").sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  return `<div class="section-l" style="margin-top:6px">Activity · last 12 months${S.site==="ALL"?"":" · "+h(siteName(S.site))}</div>
  <div class="grid2 mb">
   ${vizCard("New applications","per month",vizBars(apps,{label:"New applications per month"}))}
   ${vizCard("Patient arrivals","per month",vizBars(arr,{label:"Patient arrivals per month"}))}
   ${vizCard("Invoiced (EUR)","per month",vizBars(rev,{label:"Invoiced per month",fmt:n=>Math.round(n).toLocaleString("en-GB")+" €"}))}
   ${vizCard("Patients by nationality","top 8",vizHBars(natRows))}
  </div>`;
}

/* ---------- Website & SEO ---------- */
const SEO_SITES=[["TN","dialysetunisie.com"],["TR","dialysisturkey.com"]];
function seoSum(rows,from,to,idx){ return rows.filter(r=>r[0]>=from&&r[0]<=to).reduce((a,r)=>a+(Number(r[idx])||0),0); }
function seoAvgPos(rows,from,to){ const r=rows.filter(x=>x[0]>=from&&x[0]<=to&&Number(x[2])>0); const imp=r.reduce((a,x)=>a+Number(x[2]),0); return imp?r.reduce((a,x)=>a+Number(x[4])*Number(x[2]),0)/imp:null; }
function delta(cur,prev,better="up"){ if(prev==null||cur==null||!prev) return ""; const ch=(cur-prev)/prev*100; if(!isFinite(ch)) return ""; const good=better==="up"?ch>=0:ch<=0;
  return `<span class="delta ${good?"good":"bad"}">${ch>=0?"▲":"▼"} ${Math.abs(ch).toFixed(0)}% <small>vs previous 28 days</small></span>`; }
function viewSeo(v){
  if(!S.seoSite) S.seoSite=S.site==="TR"?"TR":"TN";
  const site=S.seoSite, doc=(S.seo||[]).find(x=>x.id===site)||null, host=(SEO_SITES.find(x=>x[0]===site)||[])[1];
  const pick=`<div class="filters">${SEO_SITES.map(([k,d])=>`<button data-seosite="${k}" aria-pressed="${site===k}">${h(d)}</button>`).join("")}</div>`;
  if(!doc||!doc.gsc){ v.innerHTML=`<div class="head"><h2>Website & SEO</h2><button class="btn" id="seoRefresh">Refresh now</button></div>${pick}<section class="panel"><div class="empty">No data for ${h(host)} yet. Claude fills this page from Google Search Console and Google Analytics every two weeks.</div></section>`; return; }
  const g=doc.gsc||{}, daily=(g.daily||[]).slice().sort((a,b)=>a[0].localeCompare(b[0])), ga=doc.ga||{}, gad=(ga.daily||[]).slice().sort((a,b)=>a[0].localeCompare(b[0]));
  const end=daily.length?daily[daily.length-1][0]:today(), d28=addDays(end,-27), p0=addDays(end,-55), p1=addDays(end,-28);
  const clicks=seoSum(daily,d28,end,1), clicksP=seoSum(daily,p0,p1,1), impr=seoSum(daily,d28,end,2), imprP=seoSum(daily,p0,p1,2), pos=seoAvgPos(daily,d28,end), posP=seoAvgPos(daily,p0,p1);
  const hist=doc.history||[], gEnd=gad.length?gad[gad.length-1][0]:end;
  const users=gad.length?seoSum(gad,addDays(gEnd,-27),gEnd,1):(ga.users28??null), usersP=gad.length?seoSum(gad,addDays(gEnd,-55),addDays(gEnd,-28),1):(hist.length>=2?hist[hist.length-2].users28:null);
  const tile=(n,l,dl)=>`<div class="kpi" style="cursor:default"><div class="n">${n}</div><div class="l">${l}</div>${dl||""}</div>`;
  const next=doc.updatedAt?fmtDate(addDays(String(doc.updatedAt).slice(0,10),14)):"";
  const qrows=(g.queries||[]).slice(0,25), prevQ={}; ((doc.prev||{}).queries||[]).forEach(q=>prevQ[q[0]]=Number(q[4]));
  v.innerHTML=`<div class="head"><h2>Website & SEO</h2><span class="sub">${h(host)} · updated ${doc.updatedAt?ago(doc.updatedAt)+" ago":"—"}${doc.source==="api"?" · live from Google, refreshed daily":next?" · next update around "+next:""}</span><button class="btn" id="seoRefresh">Refresh now</button></div>
  ${pick}
  ${doc.syncError?`<div class="banner warnb"><b>Google connection</b><span>${h(doc.syncError)}</span></div>`:""}
  ${doc.summary?`<div class="banner" style="align-items:flex-start"><b>Claude's summary</b><span style="white-space:pre-line">${h(doc.summary)}</span></div>`:""}
  <div class="kpis">
   ${tile(fmtN(clicks),"Clicks from Google · last 28 days",delta(clicks,clicksP))}
   ${tile(fmtN(impr),"Times shown in Google · last 28 days",delta(impr,imprP))}
   ${tile(pos?"#"+pos.toFixed(1):"—","Average position (1 = top)",pos&&posP?(Math.abs(posP-pos)<0.05?`<span class="delta">= same as previous 28 days</span>`:`<span class="delta ${pos<posP?"good":"bad"}">${pos<posP?"▲":"▼"} ${Math.abs(posP-pos).toFixed(1)} places ${pos<posP?"better":"worse"} <small>vs previous 28 days</small></span>`):"")}
   ${tile(users!=null?fmtN(users):"—","Visitors · last 28 days (Analytics)",users!=null?(usersP!=null?delta(users,usersP):`<span class="delta">first measurement</span>`):`<span class="delta">Analytics not connected yet</span>`)}
  </div>
  <div class="grid2 mb">
   ${vizCard("Clicks from Google","per day · last 90 days",vizLine(daily.map(r=>({x:r[0],y:Number(r[1])})),{label:"Clicks per day"}))}
   ${vizCard("Average position","per day · higher on the chart = better",vizLine(daily.filter(r=>Number(r[2])>0).map(r=>({x:r[0],y:Number(r[4])})),{invert:true,label:"Average position per day"}))}
   ${vizCard("Visitors","Google Analytics",gad.length?vizLine(gad.map(r=>({x:r[0],y:Number(r[1])})),{label:"Visitors per day"}):hist.length>=2?vizBars(hist.map(x=>({label:fmtDate(x.at),value:x.users28||0,tip:"28 days before "+fmtDate(x.at)})),{label:"Visitors per 28 days"}):`<div class="empty">${users!=null?`<b style="font-size:28px;color:var(--ink)">${fmtN(users)}</b> visitors in the last 28 days.<br>`:""}A point is added at every update, so this becomes a curve over time.</div>`)}
   ${vizCard("Times shown in Google","per day",vizLine(daily.map(r=>({x:r[0],y:Number(r[2])})),{label:"Impressions per day"}))}
   ${vizCard("Visitors by country","Analytics",(ga.countries||[]).length?vizHBars((ga.countries||[]).map(r=>({label:r[0],value:Number(r[1])}))):vizHBars((g.countries||[]).map(r=>({label:r[0],value:Number(r[1])})))+`<p class="sub" style="margin:8px 0 0">Showing Google clicks by country until Analytics is connected.</p>`)}
   ${vizCard("Clicks by country","Search Console",vizHBars((g.countries||[]).map(r=>({label:r[0],value:Number(r[1])}))))}
  </div>
  <section class="panel mb"><h3>Your Google searches <span>top 25 · last 90 days</span></h3><div class="tablewrap"><table class="items seo"><thead><tr><th>Search</th><th>Clicks</th><th>Shown</th><th>Position</th><th>Change</th></tr></thead><tbody>
   ${qrows.map(q=>{ const p=Number(q[4]), was=prevQ[q[0]]; const ch=was?was-p:null; return `<tr><td>${h(q[0])}</td><td>${fmtN(q[1])}</td><td>${fmtN(q[2])}</td><td>#${p.toFixed(1)}</td><td>${ch==null?'<span class="sub">new</span>':Math.abs(ch)<0.5?'<span class="sub">=</span>':`<span class="delta ${ch>0?"good":"bad"}">${ch>0?"▲":"▼"} ${Math.abs(ch).toFixed(1)}</span>`}</td></tr>`; }).join("")||`<tr><td colspan="5" class="empty">No searches yet.</td></tr>`}
  </tbody></table></div></section>
  <section class="panel mb"><h3>Top pages <span>clicks · last 90 days</span></h3><ul class="rows">${(g.pages||[]).slice(0,10).map(p=>`<li><div class="row" style="cursor:default"><span class="site-tag">${fmtN(p[1])}</span><span style="min-width:0"><div class="t">${h(String(p[0]).replace(/^https?:\/\/(www\.)?[^/]+/,"")||"/")}</div><div class="s">shown ${fmtN(p[2])} times · position #${Number(p[4]).toFixed(1)}</div></span><span class="r"></span></div></li>`).join("")}</ul></section>
  ${(doc.history||[]).length>=2?vizCard("Progress over time","clicks per 28 days, at each update",vizBars((doc.history||[]).map(x=>({label:fmtDate(x.at),value:x.clicks28,tip:fmtDate(x.at)}))))
    :""}`;
}
document.addEventListener("click",e=>{ const b=e.target.closest("[data-seosite]"); if(b){ S.seoSite=b.dataset.seosite; render(); } });
document.addEventListener("click",async e=>{ const b=e.target.closest("#seoRefresh"); if(!b) return; b.disabled=true; b.textContent="Refreshing…";
  try{ const {data,error}=await window.dwSupabase.functions.invoke("seo-sync",{body:{}}); let m=data&&data.error; if(error){ try{ m=(await error.context.json()).error; }catch{ m=error.message; } }
    toast(m?m:"Updated from Google"); }catch(er){ toast(String(er.message||er)); } b.disabled=false; b.textContent="Refresh now"; });

/* ================= v4: Team ================= */
ICONS.team='<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/>';
NAV[2][1].push(["team","Team"]);
const ROLE_INFO={admin:["Admin","Everything, including the team and settings"],staff:["Staff","Works in the app: patients, emails, planning, invoices"],viewer:["Viewer","Can look, can't change anything"]};
const isAdmin=()=>{ const me=window.dwMe; return !me||me.owner||me.role==="admin"; };
async function teamCall(body){ const {data,error}=await window.dwSupabase.functions.invoke("team",{body}); if(error){ let m=error.message; try{ m=(await error.context.json()).error||m; }catch{} throw new Error(m); } if(data&&data.error) throw new Error(data.error); return data; }
async function loadTeam(){ const {data,error}=await window.dwSupabase.from("team_members").select("*").order("invited_at",{ascending:true}); if(error) throw error; S.team=data||[]; return S.team; }
function viewTeam(v){
  if(!isAdmin()){ v.innerHTML=`<div class="head"><h2>Team</h2></div><section class="panel"><div class="empty">Only admins can manage the team.</div></section>`; return; }
  const list=S.team;
  const me=window.dwMe||{};
  v.innerHTML=`<div class="head"><h2>Team</h2><span class="sub">${list?list.length+1:"…"} people</span><button class="btn primary" id="tmInvite">Invite someone</button></div>
  <div class="banner"><b>How it works</b><span>Invite someone by email: they get a link from contact@dialysetunisie.com, choose their password and can install the app on their phone or computer. Everyone shares the same patients, emails and planning. Remove someone and their access stops at once.</span></div>
  <section class="panel"><h3>Members</h3><ul class="rows">
   <li><div class="row" style="cursor:default"><span class="dot ok"></span><span style="min-width:0"><div class="t">${me.owner?"You":"Owner"} <span class="chip">owner</span></div><div class="s">${h(me.owner?me.email||"":"Taieb Aamira")}</div></span><span class="r">all access</span></div></li>
   ${list==null?`<li class="empty">Loading…</li>`:list.map(m=>`<li><div class="row" style="cursor:default;grid-template-columns:auto minmax(0,1fr) auto"><span class="dot ${m.status==="active"?"ok":"warn"}"></span>
     <span style="min-width:0"><div class="t">${h(m.name||m.email)} <span class="chip">${m.status==="active"?"active":"invited"}</span></div><div class="s">${h(m.email)}${m.last_seen?` · last seen ${ago(m.last_seen)} ago`:m.status!=="active"?` · invited ${ago(m.invited_at)} ago`:""}</div></span>
     <span class="r tmact"><select class="btn small" data-tmrole="${h(m.email)}" aria-label="Role">${Object.entries(ROLE_INFO).map(([k,[l]])=>`<option value="${k}" ${m.role===k?"selected":""}>${l}</option>`).join("")}</select>
      ${m.status!=="active"?`<button class="btn small" data-tmresend="${h(m.email)}">Resend</button>`:""}<button class="btn small danger" data-tmrm="${h(m.email)}">Remove</button></span></div></li>`).join("")}
  </ul></section>
  <section class="panel" style="margin-top:14px"><h3>Roles</h3><ul class="rows">${Object.entries(ROLE_INFO).map(([k,[l,d]])=>`<li><div class="row" style="cursor:default"><span class="chip">${l}</span><span class="s" style="min-width:0">${d}</span><span></span></div></li>`).join("")}</ul></section>`;
  $("tmInvite").onclick=openInvite;
  if(list==null) loadTeam().then(()=>{ if(S.tab==="team") render(); }).catch(e=>toast("Couldn't load the team: "+(e.message||e)));
}
function openInvite(){
  drawer(`<header><h3>Invite someone</h3><button class="x" data-close aria-label="Close">×</button></header><div class="body">
   <div class="form">
    <label class="f full">Email<input id="tm_email" type="email" inputmode="email" placeholder="name@example.com"></label>
    <label class="f">Name<input id="tm_name" placeholder="First name"></label>
    <label class="f">Email language<select id="tm_lang"><option value="fr">Français</option><option value="en">English</option></select></label>
    <div class="f full"><span class="lbl">Role</span><div class="att" style="margin-top:6px">${Object.entries(ROLE_INFO).map(([k,[l,d]])=>`<label class="chk"><input type="radio" name="tm_role" value="${k}" ${k==="staff"?"checked":""}> <b>${l}</b> – ${d}</label>`).join("")}</div></div>
   </div>
   <div class="actions"><button class="btn primary" id="tmSend">Send invitation</button></div><div class="sub" id="tmMsg"></div></div>`);
  $("tmSend").onclick=async()=>{ const email=$("tm_email").value.trim(), msg=$("tmMsg"), b=$("tmSend");
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)){ msg.textContent="Check the email address."; return; }
    b.disabled=true; b.textContent="Sending…";
    try{ await teamCall({action:"invite",email,name:$("tm_name").value.trim(),role:(document.querySelector('[name="tm_role"]:checked')||{}).value||"staff",lang:$("tm_lang").value});
      toast("Invitation sent to "+email); closeDrawer(); await loadTeam(); render(); }
    catch(e){ msg.textContent=String(e.message||e); b.disabled=false; b.textContent="Send invitation"; } };
}
document.addEventListener("change",async e=>{ const r=e.target.closest("[data-tmrole]"); if(!r) return;
  try{ await teamCall({action:"role",email:r.dataset.tmrole,role:r.value}); toast("Role changed"); await loadTeam(); render(); }catch(er){ toast(String(er.message||er)); } });
document.addEventListener("click",async e=>{
  const rs=e.target.closest("[data-tmresend]"); if(rs){ rs.disabled=true; try{ await teamCall({action:"resend",email:rs.dataset.tmresend}); toast("Invitation sent again"); }catch(er){ toast(String(er.message||er)); } rs.disabled=false; return; }
  const rm=e.target.closest("[data-tmrm]"); if(rm){ if(!rm.dataset.sure){ rm.dataset.sure=1; rm.textContent="Tap again to remove"; return; }
    try{ await teamCall({action:"remove",email:rm.dataset.tmrm}); toast("Removed – their access has stopped"); await loadTeam(); render(); }catch(er){ toast(String(er.message||er)); } }
});

/* ---------- boot ---------- */
(function(){ const hsh=(location.hash||"").slice(1); if(hsh==="today") S.tab="dashboard"; else if(["dashboard","inbox","patients","planner","centres","insurers","invoices","money","campaigns","seo","team","replies","settings"].includes(hsh)) S.tab=hsh; })();
initTheme();
render();
const timeout=setTimeout(()=>{ if(!S.ready){ $("savestate").textContent="Not connected"; $("view").innerHTML=`<div class="empty">Your records are still loading. Check your internet connection.</div>`; } },10000);
(async()=>{
  db = await claude.use("db");
  if(!db){ clearTimeout(timeout); $("savestate").textContent="Not connected"; $("view").innerHTML=`<div class="empty">Sign in to see your records.</div>`; return; }
  const loaded=new Set(), need=["emails","patients","invoices","replies","commissions","sessions","settings"];
  const done=k=>{ loaded.add(k); if(need.every(x=>loaded.has(x))){ clearTimeout(timeout); S.ready=true; $("savestate").textContent="Saved automatically"; } render(); };
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{ S[key]=snap.docs.map(d=>({id:d.id,...d.data()})); if(S.drawer){ renderChrome(); if(S.ready) {} } else render(); done(key); if(S.drawer) renderBehind(); },err=>{ $("savestate").textContent="Sync problem: "+err.code; });
  sub("campaigns","campaigns"); sub("seo","seo"); sub("emails","emails"); sub("patients","patients"); sub("invoices","invoices"); sub("replies","replies"); sub("commissions","commissions"); sub("sessions","sessions");
  db.doc("settings/main").onSnapshot(s=>{ S.settings=s.exists?(s.data()||{}):{}; done("settings"); },()=>{});
  claude.use("sample").then(x=>sample=x); claude.use("downloads").then(x=>downloads=x); claude.use("assets").then(x=>assets=x);
})();
function renderBehind(){ const v=$("view"); if(!S.ready) return; ({dashboard:viewDashboard,today:viewDashboard,centres:viewCentres,campaigns:viewCampaigns,seo:viewSeo,team:viewTeam,inbox:viewInbox,patients:viewPatients,invoices:viewInvoices,money:viewMoney,planner:viewPlanner,insurers:viewInsurers,replies:viewReplies,settings:viewSettings}[S.tab]||viewDashboard)(v); }
</script>
